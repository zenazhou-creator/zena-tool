<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Recipes</title>
<style>
:root{--bg:#FBF6EE;--card:#fff;--ink:#3B2A22;--dim:#8C7B70;--line:#EADFD2;--ac:#D9502F;--acbg:#FBE3DA;--teal:#3E7C8C;--serif:"Songti SC","Noto Serif SC",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 12px}
button:hover{border-color:#cdb9a6}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.out{border-color:var(--ac);color:var(--ac);font-weight:600}
button.ic{border:0;background:none;padding:4px;display:inline-flex;color:#B8A798}
button.ic:hover{color:var(--ac)}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #F3B9A8;outline-offset:1px}
textarea{min-height:110px;resize:vertical}
[hidden]{display:none!important}
.dim{color:var(--dim)} .row{display:flex;gap:10px;align-items:center} .sp{flex:1}
#top{height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;background:#FFFDF9;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font:700 18px var(--serif);white-space:nowrap}
.logo i{width:24px;height:24px;border-radius:8px;background:var(--ac)}
#q{max-width:480px;border-radius:20px;padding-left:16px}
.body{display:flex;min-height:calc(100vh - 64px)}
#side{width:240px;flex:none;padding:18px 18px 30px 24px;border-right:1px solid var(--line);position:sticky;top:64px;align-self:flex-start;max-height:calc(100vh - 64px);overflow:auto}
.nosb #side{display:none}
.grp{margin:18px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#A8978B}
.it{display:flex;align-items:center;gap:8px;height:33px;padding:0 10px;margin:0 -10px;border-radius:8px;cursor:pointer;color:#5B463A}
.it:hover{background:#F5EBDD} .it.on{background:var(--acbg);color:#B83A1C;font-weight:600}
.it .n{margin-left:auto;font-size:12px;color:#A8978B}
.sw{width:10px;height:10px;border-radius:50%}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{padding:1px 10px;border-radius:14px;background:#F2E9DD;color:#6B5649;font-size:13px;cursor:pointer;border:0}
.tg.on{background:var(--teal);color:#fff}
#content{flex:1;min-width:0;padding:20px 28px 40px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar select{width:auto}
#grid.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
#grid.empty{text-align:center;padding:100px 20px;color:var(--dim)}
#grid.empty p{font:600 20px var(--serif);color:var(--ink)}
.card{background:var(--card);border:1px solid #EFE4D6;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(120,80,40,.07);cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(120,80,40,.13)}
.cv{position:relative;aspect-ratio:16/9;background:center/cover;display:flex;align-items:center;justify-content:center;font:60px var(--serif);color:rgba(255,255,255,.92)}
.star{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;border:0;padding:0;color:#C2B3A6}
.star.on{color:#E2A33B}
.pills{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;font:600 12px system-ui}
.pl{padding:1px 9px;border-radius:10px;background:rgba(255,255,255,.92);color:#5B463A}
.cb{padding:12px 14px 14px;position:relative}
.nm{font:700 17px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:50px}
.mt{display:flex;gap:12px;align-items:center;color:var(--dim);font-size:13px}
.mt span{display:flex;align-items:center;gap:4px}
.tl{margin-top:4px;font-size:12px;color:var(--teal);min-height:18px}
.ops{position:absolute;right:10px;bottom:10px;display:flex}
.wrap{max-width:1040px;margin:0 auto;padding:20px 24px 50px}
.hero{width:100%;max-height:360px;object-fit:cover;border-radius:16px;margin:14px 0}
.hero.ph{height:200px;display:flex;align-items:center;justify-content:center;font:90px var(--serif);color:rgba(255,255,255,.9)}
h1.t{font:700 30px var(--serif);margin:6px 0}
.two{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start;margin-top:18px}
.cols{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.box{background:var(--card);border:1px solid #EFE4D6;border-radius:14px;padding:16px 18px;margin-bottom:16px}
.box h3{margin:0 0 8px;font:700 16px var(--serif)}
.hd{font-weight:700;margin:10px 0 2px;color:var(--ac)}
.ln{white-space:pre-wrap;padding:3px 0}
.step{display:flex;gap:12px;padding:6px 0}
.step b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acbg);color:#B83A1C;display:grid;place-items:center;font-size:13px}
.fl{display:block;margin:12px 0 3px;font-size:12px;color:var(--dim)}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
#imgbox{border:2px dashed var(--line);border-radius:12px;padding:12px;text-align:center}
#imgbox img{max-width:100%;max-height:200px;border-radius:8px;display:block;margin:0 auto 8px}
.tagin{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fbar{position:sticky;top:64px;z-index:4;background:var(--bg);padding:10px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:10px;z-index:20}
#toast button{margin-left:10px;color:#fff;background:none;border-color:#fff6}
dialog{border:0;border-radius:16px;background:#fff;color:var(--ink);width:460px;max-width:92vw;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:#3B2A2266}
dialog h2{margin:0 0 10px;font:700 20px var(--serif)}
.mi{display:block;width:100%;text-align:left;margin:6px 0}
body.ro #newBtn,body.ro #menuBtn,body.ro .ops,body.ro #bk,body.ro #grid.empty .row,body.ro .star:not(.on){display:none!important}
body.ro .star{pointer-events:none}
@media(max-width:900px){.two,.cols{grid-template-columns:1fr}#side{width:200px}}
</style>
</head>
<body>
<div id="top">
  <button class="ic" id="sbBtn" title="Toggle filters" style="color:var(--ink)"></button>
  <div class="logo" id="logo" style="cursor:pointer"><i></i>My Recipes</div>
  <input id="q" placeholder="Search name, ingredients, tags, category">
  <span class="sp"></span>
  <span id="syncst" class="dim" style="font-size:12px"></span>
  <button class="out" id="rollBtn"></button>
  <button class="pri" id="newBtn"></button>
  <button class="ic" id="menuBtn" title="More" style="color:var(--ink)"></button>
</div>
<div id="home" class="body"><aside id="side"></aside><main id="content"><div class="bar"><b id="info"></b><span class="sp"></span><span class="dim">Sort</span><select id="sort"></select></div><div id="bk"></div><div id="grid"></div></main></div>
<div id="detail" hidden></div>
<div id="form" hidden></div>
<dialog id="dlg"></dialog>
<div id="toast" hidden></div>
<input type="file" id="jsonFile" accept=".json" hidden>
<input type="file" id="xlsFile" accept=".xlsx,.csv,.json" hidden>

<script>
'use strict';
/* ===== 1. Config ===== */
const DIFF = ['简单', '中等', '困难'];                           // stored values (kept for data compatibility)
const DL = ['Easy', 'Medium', 'Hard'], DPILL = [['#E4EFD9', '#4A7A36'], ['#FBE9C4', '#9A6A10'], ['#F8D9D3', '#A8352B']], DDOT = ['#5E8C4A', '#E2A33B', '#C8423A'];
const DEF_CATS = ['Breakfast', 'Noodles', 'Stew', 'Quick'];
const GRAD = [['#F6B58C', '#E8795A'], ['#F5DE96', '#E8B94F'], ['#F2B3B0', '#D9777A'], ['#B7CF9E', '#7FA566'], ['#A9CFD8', '#6FA3B5'], ['#E9CDA8', '#C99A68']];
const ld = r => r.hist.length ? r.hist[r.hist.length - 1] : 0;
const SORTS = {
  new: ['Newest', (a, b) => b.createdAt - a.createdAt], old: ['Oldest', (a, b) => a.createdAt - b.createdAt],
  time: ['Quickest first', (a, b) => (a.min || 1e9) - (b.min || 1e9)],
  recent: ['Recently cooked', (a, b) => ld(b) - ld(a)], stale: ['Not cooked longest', (a, b) => ld(a) - ld(b)],
  name: ['Name A–Z', (a, b) => a.name.localeCompare(b.name)],
};
const HEADERS = ['Name', 'Category', 'Difficulty', 'Minutes', 'Servings', 'Tags', 'Source', 'Ingredients', 'Steps', 'Notes'];
const ICONS = {
  star: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  dice: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="12" cy="12" r="1"/>',
  dots: '<circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/>',
  filter: '<path d="M4 6h16M7 12h10M10 18h4"/>', back: '<path d="m15 6-6 6 6 6"/>',
};
const ico = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ===== 2. Data layer (all IndexedDB access) ===== */
const DB = {
  db: null,
  open() {
    return new Promise((ok, no) => {
      const r = indexedDB.open('recipes-db', 1);
      r.onupgradeneeded = () => { const d = r.result; ['recipes', 'thumbs', 'fulls'].forEach(n => d.createObjectStore(n, { keyPath: 'id' })); d.createObjectStore('meta'); };
      r.onsuccess = () => { this.db = r.result; ok(); }; r.onerror = () => no(r.error);
    });
  },
  run(s, mode, fn) { return new Promise((ok, no) => { const t = this.db.transaction(s, mode), r = fn(t.objectStore(s)); t.oncomplete = () => ok(r && r.result); t.onerror = () => no(t.error); }); },
  all(s) { return this.run(s, 'readonly', o => o.getAll()); }, get(s, k) { return this.run(s, 'readonly', o => o.get(k)); },
  put(s, v, k) { return this.run(s, 'readwrite', o => o.put(v, k)); }, del(s, k) { return this.run(s, 'readwrite', o => o.delete(k)); },
};

/* ===== 3. State & helpers ===== */
let R = [], T = {}, CATS = [], lastExport = 0, undoBuf = null, D = null, draftT, lastRoll = null;
let F = { q: '', cat: null, diff: null, time: null, tags: [] };
let sortKey = localStorage.getItem('rc.sort') || 'new';
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const catName = id => (CATS.find(c => c.id === id) || {}).name || '';
const fmt = t => new Date(t).toLocaleDateString('en-GB');
const metaLine = r => [r.min && r.min + ' min', r.serv && r.serv + (r.serv === 1 ? ' serving' : ' servings')].filter(Boolean).join(' · ');
const saveR = r => DB.put('recipes', r);
const touch = r => { r.updatedAt = Date.now(); saveR(r); syncSoon(); };      // any edit that must reach the other person
const h = (tag, p = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in p) { if (k === 'on') for (const n in p.on) e.addEventListener(n, p.on[n]); else if (k === 'html') e.innerHTML = p[k]; else if (k in e) e[k] = p[k]; else e.setAttribute(k, p[k]); }
  e.append(...kids); return e;
};
const btn = (t, fn, cls = '') => h('button', { textContent: t, class: cls, on: { click: fn } });
const ib = (name, fn, title, cls = 'ic') => h('button', { class: cls, title, html: ico(name, 17), on: { click: e => { e.stopPropagation(); fn(); } } });
const grad = n => GRAD[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % GRAD.length];
const cover = (r, cls) => {
  const el = h('div', { class: cls }); const g = grad(r.name);
  if (T[r.id]) el.style.backgroundImage = `url(${T[r.id]})`; else { el.style.background = `linear-gradient(135deg,${g[0]},${g[1]})`; el.textContent = [...r.name][0].toUpperCase(); }
  return el;
};
function toast(msg, actText, act) {
  const t = $('#toast'); t.replaceChildren(msg); t.hidden = false;
  if (act) t.append(btn(actText, () => { act(); t.hidden = true; }));
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 6000);
}

/* ===== 4. Filter & sort (pure logic) ===== */
function visible() {
  const ws = F.q.toLowerCase().split(/\s+/).filter(Boolean);
  return R.filter(r => {
    const hay = (r.name + '\n' + r.ing + '\n' + r.tags.join(' ') + '\n' + catName(r.cat)).toLowerCase();
    return ws.every(w => hay.includes(w)) && (!F.cat || r.cat === F.cat) && (!F.diff || r.diff === F.diff) && (!F.time || (r.min && r.min <= F.time)) && F.tags.every(t => r.tags.includes(t));
  }).sort((a, b) => (!!b.star - !!a.star) || SORTS[sortKey][1](a, b));
}
const filtering = () => F.q || F.cat || F.diff || F.time || F.tags.length;
const clearF = () => { F = { q: '', cat: null, diff: null, time: null, tags: [] }; $('#q').value = ''; renderHome(); };

/* ===== 5. Home: sidebar + grid ===== */
function renderSide() {
  const tog = (k, v) => () => { F[k] = F[k] === v ? null : v; renderHome(); };
  const item = (label, n, on, fn, dot) => h('div', { class: 'it' + (on ? ' on' : ''), on: { click: fn } }, ...(dot ? [h('span', { class: 'sw', style: 'background:' + dot })] : []), label, h('span', { class: 'n', textContent: n }));
  const tags = {}; R.forEach(r => r.tags.forEach(t => tags[t] = (tags[t] || 0) + 1));
  $('#side').replaceChildren(
    h('div', { class: 'grp', textContent: 'Category', style: 'margin-top:0' }),
    item('All', R.length, !F.cat, () => { F.cat = null; renderHome(); }),
    ...CATS.map(c => item(c.name, R.filter(r => r.cat === c.id).length, F.cat === c.id, tog('cat', c.id))),
    h('div', { class: 'grp', textContent: 'Difficulty' }),
    ...DIFF.map((d, i) => item(DL[i], R.filter(r => r.diff === d).length, F.diff === d, tog('diff', d), DDOT[i])),
    h('div', { class: 'grp', textContent: 'Time' }),
    item('Within 30 min', R.filter(r => r.min && r.min <= 30).length, F.time === 30, tog('time', 30)),
    item('Within 1 hour', R.filter(r => r.min && r.min <= 60).length, F.time === 60, tog('time', 60)),
    ...(Object.keys(tags).length ? [h('div', { class: 'grp', textContent: 'Tags' }), h('div', { class: 'tags' }, ...Object.keys(tags).sort().map(t =>
      h('button', { class: 'tg' + (F.tags.includes(t) ? ' on' : ''), textContent: '#' + t, on: { click: () => { F.tags = F.tags.includes(t) ? F.tags.filter(x => x !== t) : [...F.tags, t]; renderHome(); } } })))] : []),
    ...(filtering() ? [h('div', { style: 'margin-top:18px' }, btn('Clear filters', clearF))] : []));
}
function card(r) {
  const cv = cover(r, 'cv'), c = catName(r.cat), m = metaLine(r);
  cv.append(h('button', { class: 'star' + (r.star ? ' on' : ''), title: 'Favorite', html: ico('star', 16), on: { click: e => { e.stopPropagation(); r.star = !r.star; touch(r); renderHome(); } } }),
    h('div', { class: 'pills' },
      ...(r.diff ? [h('span', { class: 'pl', style: `background:${DPILL[DIFF.indexOf(r.diff)][0]};color:${DPILL[DIFF.indexOf(r.diff)][1]}`, textContent: DL[DIFF.indexOf(r.diff)] })] : []),
      ...(c ? [h('span', { class: 'pl', textContent: c })] : [])));
  return h('div', { class: 'card', on: { click: () => location.hash = '#r/' + r.id } }, cv,
    h('div', { class: 'cb' }, h('div', { class: 'nm', textContent: r.name }),
      h('div', { class: 'mt' }, ...(m ? [h('span', { html: ico('clock', 14) + m })] : [])),
      h('div', { class: 'tl', textContent: r.tags.slice(0, 4).map(t => '#' + t).join(' ') }),
      h('div', { class: 'ops' }, ib('edit', () => location.hash = '#e/' + r.id, 'Edit'), ib('trash', () => remove(r), 'Delete'))));
}
function renderHome() {
  renderSide();
  const list = visible(), g = $('#grid'), old = R.length && (!lastExport || Date.now() - lastExport > 30 * 864e5);
  $('#info').textContent = R.length ? `${list.length} ${list.length === 1 ? 'recipe' : 'recipes'}` : '';
  $('#bk').replaceChildren(...(old ? [h('div', { class: 'box row', style: 'padding:8px 14px;margin-bottom:14px' }, h('span', { class: 'dim sp', textContent: 'Tip: export a backup file now and then — data lives only in this browser.' }), btn('Export backup', () => exportJSON(true)))] : []));
  g.replaceChildren();
  if (!R.length) { g.className = 'empty'; g.append(h('p', { textContent: 'No recipes yet' }), h('div', { class: 'row', style: 'justify-content:center' }, btn('New recipe', () => location.hash = '#new', 'pri'), btn('Import', batchDlg))); return; }
  if (!list.length) { g.className = 'empty'; g.append(h('p', { textContent: 'No recipes match your filters' }), btn('Clear filters', clearF)); return; }
  g.className = 'grid'; list.forEach(r => g.append(card(r)));
}

/* ===== 6. Delete with undo ===== */
async function remove(r) {
  if (!confirm(`Delete "${r.name}"?`)) return;
  undoBuf = { r, th: T[r.id], full: await DB.get('fulls', r.id) };
  R = R.filter(x => x !== r); delete T[r.id];
  await Promise.all([DB.del('recipes', r.id), DB.del('thumbs', r.id), DB.del('fulls', r.id)]); await addTomb(r.id);
  if (location.hash) location.hash = ''; else renderHome();
  toast('Recipe deleted', 'Undo', async () => {
    const u = undoBuf; R.push(u.r); u.r.updatedAt = Date.now(); await saveR(u.r); await delTomb(u.r.id); syncSoon();
    if (u.th) { T[u.r.id] = u.th; await DB.put('thumbs', { id: u.r.id, d: u.th }); }
    if (u.full) await DB.put('fulls', u.full); renderHome();
  });
}

/* ===== 7. Detail page ===== */
function lines(text, num) {
  const box = h('div'); let n = 0;
  text.split('\n').map(s => s.trim()).filter(Boolean).forEach(s => {
    if (s[0] === '#') { n = 0; box.append(h('div', { class: 'hd', textContent: s.replace(/^#+\s*/, '') })); }
    else if (num) box.append(h('div', { class: 'step' }, h('b', { textContent: ++n }), h('span', { textContent: s })));
    else box.append(h('div', { class: 'ln', textContent: '• ' + s }));
  });
  return box;
}
async function showDetail0(id) {
  const r = R.find(x => x.id === id), d = $('#detail'); if (!r) { location.hash = ''; return; }
  const full = RO ? await viewFull(r) : await DB.get('fulls', id), n = r.hist.length, c = catName(r.cat), box = (t, v) => v ? [h('div', { class: 'box' }, h('h3', { textContent: t }), v)] : [];
  const hero = full ? h('img', { class: 'hero', src: full.d }) : cover(r, 'hero ph');
  d.replaceChildren(h('div', { class: 'wrap' },
    h('div', { class: 'row' }, btn('← Back', () => location.hash = ''), h('span', { class: 'sp' }),
      btn(r.star ? '★ Favorited' : '☆ Favorite', () => { r.star = !r.star; touch(r); showDetail(id); }), btn('Edit', () => location.hash = '#e/' + id), btn('Delete', () => remove(r))),
    hero, h('h1', { class: 't', textContent: r.name }),
    h('div', { class: 'dim', textContent: [metaLine(r), r.diff && DL[DIFF.indexOf(r.diff)], c, ...r.tags.map(t => '#' + t)].filter(Boolean).join('  ·  ') }),
    h('div', { class: 'row', style: 'margin:14px 0' }, btn('Cooked it ✓', () => { r.hist.push(Date.now()); touch(r); showDetail(id); }, 'pri'),
      h('span', { class: 'dim', textContent: n ? `Cooked ${n} ${n === 1 ? 'time' : 'times'} · last on ${fmt(ld(r))}` : 'Not cooked yet' }),
      ...(n ? [btn('Undo', () => { r.hist.pop(); touch(r); showDetail(id); })] : [])),
    h('div', { class: 'two' }, h('div', {}, ...box('Ingredients', r.ing.trim() && lines(r.ing, false))),
      h('div', {}, ...box('Steps', r.steps.trim() && lines(r.steps, true)), ...box('Notes', r.note.trim() && h('div', { class: 'ln', textContent: r.note })),
        ...box('Source', /^https?:/.test(r.src) && h('a', { href: r.src, target: '_blank', rel: 'noreferrer noopener', textContent: r.src }))))));
}

/* ===== 8. Image compression (stores 1280px full + 480px thumbnail) ===== */
function shrink(file, max) {

    h('div', { class: 'row', style: 'margin-top:14px' }, h('span', { class: 'sp' }), closeBtn()));
}
async function batchFile(file) {
  try { previewRows(/\.csv$/i.test(file.name) ? parseCSV(await file.text()) : await readXlsx(await file.arrayBuffer())); }
  catch (e) { alert('Could not read that file. Please use the downloaded template (.xlsx) or a .csv.'); }
}
function previewRows(rows) {
  try {
    const { items, warn } = plan(rows);
    if (!items.length) { alert('No recipes found. The first row I saw was: ' + (rows[0] || []).join(' | ') + '\nPlease use the template columns (Name, Category, …).'); return; }
    const dups = items.filter(x => x.dup).length, chk = h('input', { type: 'checkbox', style: 'width:auto' }), go = async () => {
      let n = 0, now = Date.now();
      for (const it of items) {
        if (it.dup && !chk.checked) continue;
        let cat = ''; if (it.cat) { let c = CATS.find(x => x.name.toLowerCase() === it.cat.toLowerCase()); if (!c) { c = { id: uid(), name: it.cat }; CATS.push(c); } cat = c.id; }
        const r = { id: uid(), name: it.name, createdAt: now + n, updatedAt: now + n, min: it.min, serv: it.serv, diff: it.diff, cat, tags: it.tags, star: false, hist: [], ing: it.ing, steps: it.steps, note: it.note, src: it.src };
        await saveR(r); R.push(r); n++;
      }
      await saveCats(); $('#dlg').close(); toast(`Imported ${n} recipes`); await DB.put('meta', 0, 'lastPush'); syncSoon(); renderHome();
    };
    dialog(h('h2', { textContent: 'Preview' }), h('div', { textContent: `${items.length} recipes found${dups ? `, ${dups} already exist (same name)` : ''}.` }),
      h('ul', {}, ...items.slice(0, 8).map(x => h('li', { textContent: [x.name, x.cat, x.min && x.min + ' min', x.serv && x.serv + ' servings'].filter(Boolean).join(' · ') + (x.dup ? ' (duplicate)' : '') })), ...(items.length > 8 ? [h('li', { class: 'dim', textContent: `…and ${items.length - 8} more` })] : [])),
      ...warn.slice(0, 5).map(w => h('div', { class: 'dim', textContent: '⚠ ' + w })),
      ...(dups ? [h('label', { class: 'row', style: 'margin:8px 0' }, chk, 'Import duplicates too (default: skip)')] : []),
      h('div', { class: 'row', style: 'margin-top:12px' }, h('span', { class: 'sp' }), closeBtn(), btn(`Import`, go, 'pri')));
  } catch (e) { alert('Could not read that file. Please use the downloaded template (.xlsx) or a .csv.'); }
}

/* ===== 14. Cloud sync (Cloudflare Worker + D1) ===== */
const VIEW = new URLSearchParams(location.search).get('view'), RO = !!VIEW;       // ?view=<worker url> -> read-only visitor mode
let SY = JSON.parse(localStorage.getItem('rc.sync') || 'null'), syncing = false, syncT, rt;
const syncSoon = () => { if (SY) { clearTimeout(syncT); syncT = setTimeout(sync, 1500); } };
const api = (path, opt = {}) => fetch(SY.url.replace(/\/$/, '') + path, { ...opt, headers: { 'X-Key': SY.key } }).then(r => { if (!r.ok) throw new Error(r.status); return r; });
const status = t => { const e = $('#syncst'); if (e) e.textContent = t; };
const tomb = async () => (await DB.get('meta', 'tomb')) || {};                     // ids deleted here, so deletions sync too
async function addTomb(id) { const t = await tomb(); t[id] = Date.now(); await DB.put('meta', t, 'tomb'); syncSoon(); }
async function delTomb(id) { const t = await tomb(); delete t[id]; await DB.put('meta', t, 'tomb'); }
async function addPend(id) { const p = (await DB.get('meta', 'pendImg')) || []; if (!p.includes(id)) p.push(id); await DB.put('meta', p, 'pendImg'); }
async function saveCats() { await DB.put('meta', CATS, 'cats'); await DB.put('meta', Date.now(), 'catsAt'); syncSoon(); }

async function applyRow(row) {                                                       // one recipe coming from the cloud
  const cur = R.find(x => x.id === row.id); if (cur && cur.updatedAt >= row.updated) return;
  if (row.deleted) { if (cur) { R = R.filter(x => x !== cur); delete T[cur.id]; await Promise.all([DB.del('recipes', cur.id), DB.del('thumbs', cur.id), DB.del('fulls', cur.id)]); } return; }
  const r = JSON.parse(row.data), had = cur ? cur.imgAt || 0 : 0; r.hist = r.hist || []; r.tags = r.tags || [];
  await saveR(r); cur ? Object.assign(cur, r) : R.push(r);
  if (!r.imgAt) { if (T[r.id]) { delete T[r.id]; await DB.del('thumbs', r.id); await DB.del('fulls', r.id); } }
  else if (had !== r.imgAt || !T[r.id]) {
    const [th, fu] = await Promise.all(['thumb', 'full'].map(k => api(`/img/${r.id}/${k}`).then(z => z.text()).catch(() => null)));
    if (th && fu) { T[r.id] = th; await DB.put('thumbs', { id: r.id, d: th }); await DB.put('fulls', { id: r.id, d: fu }); }
  }
}
async function sync() {
  if (!SY || syncing) return; syncing = true; status('Syncing…');
  try {
    const t0 = Date.now(), lp = (await DB.get('meta', 'lastPush')) || 0, tb = await tomb(), pend = (await DB.get('meta', 'pendImg')) || [];
    for (const r of R) if (T[r.id] && !r.imgAt) { r.imgAt = r.updatedAt || r.createdAt; await saveR(r); pend.push(r.id); }          // first sync: existing images
    for (const id of pend) {
      const r = R.find(x => x.id === id), f = await DB.get('fulls', id);
      if (r && r.imgAt > 0 && f && T[id]) { await api(`/img/${id}/thumb`, { method: 'PUT', body: T[id] }); await api(`/img/${id}/full`, { method: 'PUT', body: f.d }); }
    }
    await DB.put('meta', [], 'pendImg');
    const out = R.filter(r => r.updatedAt > lp).map(r => ({ id: r.id, updated: r.updatedAt, deleted: 0, data: JSON.stringify(r) }))
      .concat(Object.entries(tb).filter(([, u]) => u > lp).map(([id, u]) => ({ id, updated: u, deleted: 1, data: '' })));
    const catsAt = (await DB.get('meta', 'catsAt')) || 0, cats = catsAt > lp ? { updated: catsAt, data: JSON.stringify(CATS) } : null;
    for (let i = 0; i < Math.max(out.length, 1); i += 25) await api('/sync', { method: 'POST', body: JSON.stringify({ recipes: out.slice(i, i + 25), cats: i ? null : cats }) });
    await DB.put('meta', t0 - 5000, 'lastPush');
    const since = (await DB.get('meta', 'lastPull')) || 0, d = await (await api('/sync?since=' + since)).json();
    for (const row of d.recipes) await applyRow(row);
    if (d.cats && d.cats.updated > catsAt) {
      JSON.parse(d.cats.data).forEach(c => { const i = CATS.findIndex(x => x.id === c.id); i < 0 ? CATS.push(c) : CATS[i] = c; });
      await DB.put('meta', CATS, 'cats'); await DB.put('meta', d.cats.updated, 'catsAt');
    }
    await DB.put('meta', d.now - 5000, 'lastPull');
    status('Synced ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }));
    if (!location.hash) renderHome();
  } catch (e) { status('Sync failed (' + e.message + ')'); }
  syncing = false;
}
async function loadView() {                                                         // visitors: read straight from the cloud, nothing is saved locally
  const base = VIEW.replace(/\/$/, '');
  try {
    const d = await (await fetch(base + '/sync?since=0')).json();
    R = d.recipes.filter(x => !x.deleted).map(x => { const r = JSON.parse(x.data); r.hist = r.hist || []; r.tags = r.tags || []; return r; });
    if (d.cats) CATS = JSON.parse(d.cats.data);
  } catch (e) { R = []; status('Could not load (is PUBLIC_READ enabled?)'); return; }
  R.forEach(r => { if (r.imgAt) fetch(`${base}/img/${r.id}/thumb`).then(z => z.ok ? z.text() : null).then(t => { if (t) { T[r.id] = t; clearTimeout(rt); rt = setTimeout(() => { if (!location.hash) renderHome(); }, 300); } }).catch(() => 0); });
}
const viewFull = r => r.imgAt ? fetch(`${VIEW.replace(/\/$/, '')}/img/${r.id}/full`).then(z => z.ok ? z.text() : null).then(t => t && { d: t }).catch(() => null) : null;
async function showDetail(id) { await showDetail0(id); if (RO) $('#detail').querySelectorAll('button').forEach(b => { if (!/Back/.test(b.textContent)) b.remove(); }); }
async function copyView(url) {
  if (!url) { alert('Enter the Worker URL first'); return; }
  const l = location.origin + location.pathname + '?view=' + encodeURIComponent(url);
  try { await navigator.clipboard.writeText(l); toast('View-only link copied'); } catch (e) { prompt('Copy this link', l); }
}
function syncDlg() {
  const u = h('input', { placeholder: 'https://recipes-sync.yourname.workers.dev', value: SY ? SY.url : '' }), k = h('input', { type: 'password', placeholder: 'Shared passphrase', value: SY ? SY.key : '' });
  dialog(h('h2', { textContent: 'Cloud sync' }), h('p', { class: 'dim', textContent: 'Both of you enter the same Worker URL and passphrase. Changes then sync automatically.' }),
    h('span', { class: 'fl', textContent: 'Worker URL' }), u, h('span', { class: 'fl', textContent: 'Passphrase' }), k,
    h('div', { class: 'row', style: 'margin-top:14px' }, btn('Copy view-only link', () => copyView(u.value.trim())), btn('Turn off', () => { localStorage.removeItem('rc.sync'); SY = null; status(''); $('#dlg').close(); }), h('span', { class: 'sp' }), closeBtn(),
      btn('Save & sync', () => { SY = { url: u.value.trim(), key: k.value }; localStorage.setItem('rc.sync', JSON.stringify(SY)); $('#dlg').close(); sync(); setInterval(sync, 60000); }, 'pri')));
}

/* ===== 15. Routing & boot ===== */
function route() {
  const [v, id] = location.hash.slice(1).split('/');
  if (RO && (v === 'new' || v === 'e')) { location.hash = ''; return; }
  $('#home').hidden = !!v; $('#detail').hidden = v !== 'r'; $('#form').hidden = !(v === 'new' || v === 'e');
  $('#sbBtn').hidden = !!v;
  if (v === 'r') showDetail(id); else if (v === 'new') openForm(null); else if (v === 'e') openForm(id); else renderHome();
  scrollTo(0, 0);
}
(async () => {
  await DB.open();
  R = await DB.all('recipes'); R.forEach(r => { r.hist = r.hist || []; r.tags = r.tags || []; });
  (await DB.all('thumbs')).forEach(x => T[x.id] = x.d);
  CATS = await DB.get('meta', 'cats'); lastExport = (await DB.get('meta', 'lastExport')) || 0;
  if (!CATS) { CATS = DEF_CATS.map(name => ({ id: 'c-' + name.toLowerCase(), name })); await DB.put('meta', CATS, 'cats'); }
  $('#sbBtn').innerHTML = ico('filter'); $('#rollBtn').innerHTML = ico('dice', 16) + ' What to eat today?'; $('#newBtn').innerHTML = ico('plus', 16) + ' New'; $('#menuBtn').innerHTML = ico('dots');
  document.body.classList.toggle('nosb', localStorage.getItem('rc.nosb') === '1');
  $('#sbBtn').onclick = () => { const o = document.body.classList.toggle('nosb'); localStorage.setItem('rc.nosb', o ? '1' : '0'); };
  $('#sort').replaceChildren(...Object.entries(SORTS).map(([k, v]) => h('option', { value: k, textContent: v[0], selected: k === sortKey })));
  $('#sort').onchange = e => { sortKey = e.target.value; localStorage.setItem('rc.sort', sortKey); renderHome(); };
  $('#q').oninput = e => { F.q = e.target.value; if (location.hash) location.hash = ''; else renderHome(); };
  $('#logo').onclick = () => location.hash = '';
  $('#newBtn').onclick = () => location.hash = '#new'; $('#rollBtn').onclick = roll; $('#menuBtn').onclick = menu;
  $('#jsonFile').onchange = e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ''; };
  $('#xlsFile').onchange = e => { const f = e.target.files[0]; if (f) { $('#dlg').open && $('#dlg').close(); /\.json$/i.test(f.name) ? importJSON(f) : batchFile(f); } e.target.value = ''; };
  document.addEventListener('paste', e => { if (D && !$('#form').hidden) for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) setImg(it.getAsFile()); });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => { if (!$('#form').hidden) { e.preventDefault(); setImg(e.dataTransfer.files[0]); } });
  addEventListener('hashchange', route);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if (RO) { document.body.classList.add('ro'); T = {}; await loadView(); status('View only'); }
  route();
  if (SY && !RO) { sync(); setInterval(sync, 60000); }
  addEventListener('focus', sync);
})();
